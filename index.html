<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM Complet Nombres Relatifs - 4ème</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 10px;
            font-weight: bold;
        }

        .question-section {
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }

        .question-formula {
            background: #fff9e6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            border: 2px solid #ffd700;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }
        }

        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
        }

        .option:hover {
            border-color: #667eea;
            background: #f9f9f9;
            transform: translateY(-2px);
        }

        .option.selected {
            border-color: #667eea;
            background: #e8eef7;
        }

        .option.correct {
            border-color: #28a745;
            background: #d4edda;
            color: #155724;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            border-left: 5px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border-left: 5px solid #dc3545;
            color: #721c24;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .feedback-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 5px;
            line-height: 1.6;
        }

        .feedback-label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        .error-box {
            background: #ffe6e6;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid #dc3545;
        }

        .rule-box {
            background: #fffacd;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid #ffd700;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-next {
            background: #667eea;
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-next:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .score-number {
            font-size: 56px;
            font-weight: bold;
            margin: 15px 0;
        }

        .score-percentage {
            font-size: 24px;
            margin-top: 15px;
        }

        .results-section {
            margin-top: 20px;
        }

        .result-item {
            margin: 15px 0;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .result-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .result-list {
            list-style: none;
            padding-left: 0;
        }

        .result-list li {
            margin: 8px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
            position: relative;
            padding-left: 30px;
        }

        .result-list li:before {
            content: "✓";
            position: absolute;
            left: 10px;
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
        }

        .result-list.errors li:before {
            content: "✗";
            color: #dc3545;
        }

        .intro-text {
            background: #e8eef7;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }

        .intro-text h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .intro-text h3 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .intro-text ul {
            margin-left: 25px;
            margin-top: 15px;
        }

        .intro-text li {
            margin: 8px 0;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .difficulty-easy {
            background: #d4edda;
            color: #155724;
        }

        .difficulty-medium {
            background: #fff3cd;
            color: #856404;
        }

        .difficulty-hard {
            background: #f8d7da;
            color: #721c24;
        }

        .stat-box {
            background: white;
            border: 2px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin: 12px 0;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .question-title {
                font-size: 16px;
            }

            .score-number {
                font-size: 42px;
            }
        }
    </style>
</head>

        <div class="progress-bar">

        <div class="progress-text" id="progressText">0/50</div>

        <div id="quiz-content">

        </div>
    </div>

                avoidError: '❌ À éviter : Se perdre avec le nombre de signes.'

        ];

        // ==================== VARIABLES GLOBALES ====================
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let errorsByTopic = {};
        let selectedOption = -1;

        // ==================== INITIALISATION ====================
        function init() {
            showIntro();
        }

        // ==================== AFFICHAGE DE L'INTRO ====================
        function showIntro() {
            const quizContent = document.getElementById('quiz-content');
            quizContent.innerHTML = `
                <div class="intro-text">
                    <h2>👋 Bienvenue dans le QCM COMPLET !</h2>
                    <p>Ce test fusionné contient les 50 meilleures questions pour maîtriser les nombres relatifs.</p>
                    <h3>📋 Au programme :</h3>
                    <ul>
                        <li>✅ <strong>Concepts de base</strong> : signes, comparaison</li>
                        <li>✅ <strong>Addition</strong> : 2 nombres, 3 nombres, plus</li>
                        <li>✅ <strong>Soustraction</strong> : incluant les - (-x) = + x</li>
                        <li>✅ <strong>Multiplication</strong> : règles des signes, pair/impair de négatifs</li>
                        <li>✅ <strong>Carrés</strong> : pourquoi (-3)² = 9 et pas -9</li>
                        <li>✅ <strong>Inverse d'un nombre</strong> : la clé = 1/n</li>
                        <li>✅ <strong>Division</strong> : mêmes règles que la multiplication</li>
                        <li>✅ <strong>ORDRE DES OPÉRATIONS</strong> : la clé du succès !</li>
                        <li>✅ <strong>Parenthèses et exposants</strong> : exercices comme ceux du cahier</li>
                        <li>✅ <strong>Exercices mixtes complexes</strong> : tout ensemble !</li>
                    </ul>
                    <p style="margin-top: 20px;"><strong>💪 Comment ça marche ?</strong></p>
                    <ul>
                        <li>🎯 ${questions.length} questions totales</li>
                        <li>📈 Progression douce (facile → moyen → difficile)</li>
                        <li>✔️ Feedback immédiat après chaque réponse</li>
                        <li>📌 Règles à retenir en orange</li>
                        <li>❌ Erreurs à éviter en rouge</li>
                        <li>📊 Score final détaillé avec statistiques</li>
                    </ul>
                    <p style="margin-top: 20px; color: #764ba2; font-weight: bold;">On y va ? 🚀</p>
                </div>
                <button class="btn-next" onclick="nextQuestion()">Commencer le test</button>
            `;
        }

        // ==================== AFFICHAGE DES QUESTIONS ====================
        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${currentQuestionIndex + 1}/${questions.length}`;
            
            const quizContent = document.getElementById('quiz-content');
            
            let difficultyClass = 'difficulty-easy';
            let difficultyText = 'Facile';
            if (question.difficulty === 'medium') {
                difficultyClass = 'difficulty-medium';
                difficultyText = 'Moyen';
            }
            if (question.difficulty === 'hard') {
                difficultyClass = 'difficulty-hard';
                difficultyText = 'Difficile';
            }
            
            let optionsHTML = '';
            for (let i = 0; i < question.options.length; i++) {
                optionsHTML += `
                    <div class="option" onclick="selectOption(${i})" id="option-${i}">
                        ${question.options[i]}
                    </div>
                `;
            }
            
            let formulaHTML = question.formula ? `<div class="question-formula">${question.formula}</div>` : '';
            
            quizContent.innerHTML = `
                <div class="question-section">
                    <div class="question-title">
                        Question ${currentQuestionIndex + 1}/${questions.length}
                        <span class="difficulty-badge ${difficultyClass}">${difficultyText}</span>
                    </div>
                    ${question.question ? `<p style="font-size: 18px; color: #333; margin-bottom: 20px; font-weight: 500;">${question.question}</p>` : ''}
                    ${formulaHTML}
                    <div class="options">
                        ${optionsHTML}
                    </div>
                    <button class="btn-next" id="btn-next" onclick="checkAnswer()" disabled>Valider ta réponse</button>
                    <div class="feedback" id="feedback"></div>
                </div>
            `;
            
            selectedOption = -1;
        }

        // ==================== SÉLECTION D'UNE OPTION ====================
        function selectOption(index) {
            for (let i = 0; i < questions[currentQuestionIndex].options.length; i++) {
                document.getElementById('option-' + i).classList.remove('selected');
            }
            document.getElementById('option-' + index).classList.add('selected');
            selectedOption = index;
            document.getElementById('btn-next').disabled = false;
        }

        // ==================== VÉRIFIER LA RÉPONSE ====================
        function checkAnswer() {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedOption === question.correct;
            
            userAnswers.push({
                questionId: question.id,
                selected: selectedOption,
                correct: question.correct,
                isCorrect: isCorrect,
                topic: question.type
            });

            if (isCorrect) {
                score++;
                showFeedback(true, question);
            } else {
                if (!errorsByTopic[question.type]) {
                    errorsByTopic[question.type] = [];
                }
                errorsByTopic[question.type].push(question.id);
                showFeedback(false, question);
            }
        }

        // ==================== AFFICHER LE FEEDBACK ====================
        function showFeedback(isCorrect, question) {
            const feedbackDiv = document.getElementById('feedback');
            const optionDiv = document.getElementById('option-' + selectedOption);
            const correctDiv = document.getElementById('option-' + question.correct);
            
            optionDiv.classList.add(isCorrect ? 'correct' : 'incorrect');
            if (!isCorrect) correctDiv.classList.add('correct');
            
            const feedbackClass = isCorrect ? 'correct' : 'incorrect';
            const feedbackTitle = isCorrect ? '✅ Bravo !' : '❌ Pas tout à fait...';
            
            feedbackDiv.className = `feedback show ${feedbackClass}`;
            feedbackDiv.innerHTML = `
                <div class="feedback-title">${feedbackTitle}</div>
                <div class="feedback-item">
                    <span class="feedback-label">Bonne réponse :</span> ${question.options[question.correct]}
                </div>
                <div class="feedback-item">
                    <span class="feedback-label">Pourquoi ?</span> ${question.explanation}
                </div>
                <div class="rule-box">
                    ${question.rule}
                </div>
                <div class="error-box">
                    ${question.avoidError}
                </div>
            `;
            
            document.getElementById('btn-next').textContent = 'Continuer →';
            document.getElementById('btn-next').onclick = () => nextQuestion();
            document.getElementById('btn-next').disabled = false;
        }

        // ==================== QUESTION SUIVANTE ====================
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                displayQuestion();
            } else {
                showResults();
            }
        }

        // ==================== RÉSULTATS FINAUX ====================
        function showResults() {
            const quizContent = document.getElementById('quiz-content');
            const percentage = Math.round((score / questions.length) * 100);
            
            const topicsLearned = {};
            const topicsToReview = {};
            
            const allTopics = questions.map(q => q.type);
            const uniqueTopics = [...new Set(allTopics)];
            
            for (let topic of uniqueTopics) {
                if (errorsByTopic[topic]) {
                    topicsToReview[topic] = errorsByTopic[topic];
                } else {
                    topicsLearned[topic] = true;
                }
            }
            
            const topicNames = {
                'concept': '📚 Concepts de base',
                'addition': '➕ Addition',
                'subtraction': '➖ Soustraction',
                'multiplication': '✖️ Multiplication',
                'square': '² Carré d\'un nombre',
                'inverse': '1/n Inverse',
                'division': '÷ Division',
                'mixed': '🔀 Ordre des opérations',
                'equation': '❓ Équations',
                'complex': '🎯 Exercices complexes'
            };
            
            let resultsHTML = `
                <div class="score-card">
                    <h2>🎉 C'est fini !</h2>
                    <div class="score-number">${score}/${questions.length}</div>
                    <div class="score-percentage">${percentage}% de réussite</div>
                </div>
                
                <div class="results-section">
            `;
            
            if (Object.keys(topicsLearned).length > 0) {
                resultsHTML += `
                    <div class="result-item">
                        <div class="result-title">✅ Notions maîtrisées</div>
                        <ul class="result-list">
                `;
                for (let topic of Object.keys(topicsLearned)) {
                    resultsHTML += `<li>${topicNames[topic] || topic}</li>`;
                }
                resultsHTML += `</ul></div>`;
            }
            
            if (Object.keys(topicsToReview).length > 0) {
                resultsHTML += `
                    <div class="result-item">
                        <div class="result-title">🔄 À revoir absolument</div>
                        <ul class="result-list errors">
                `;
                for (let topic of Object.keys(topicsToReview)) {
                    resultsHTML += `<li>${topicNames[topic] || topic}</li>`;
                }
                resultsHTML += `</ul></div>`;
            }
            
            resultsHTML += `
                    <div class="result-item" style="background: #e8eef7;">
                        <div class="result-title">📊 Statistiques finales</div>
                        <div class="stat-box">
                            <div class="stat-number">${score}</div>
                            <div class="stat-label">Bonnes réponses</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${questions.length - score}</div>
                            <div class="stat-label">À revoir</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${percentage}%</div>
                            <div class="stat-label">Taux de réussite</div>
                        </div>
                    </div>
                </div>
                
                <button class="btn-next" onclick="location.reload()" style="margin-top: 20px;">🔄 Recommencer le test</button>
            `;
            
            quizContent.innerHTML = resultsHTML;
        }

        // ==================== DÉMARRER ====================
        init();
    </script>
